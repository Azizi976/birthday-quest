<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Minimalist birthday cake — matches the game's ink/paper/sage palette -->
  <rect width="512" height="512" fill="#F9F9F6"/>
  <g stroke="#2A2A28" stroke-width="14" fill="none" stroke-linecap="round">
    <!-- plate -->
    <line x1="96" y1="400" x2="416" y2="400"/>
    <!-- bottom tier -->
    <rect x="136" y="304" width="240" height="96"/>
    <!-- top tier -->
    <rect x="176" y="224" width="160" height="80"/>
    <!-- candle -->
    <line x1="256" y1="224" x2="256" y2="164"/>
  </g>
  <!-- flame -->
  <ellipse cx="256" cy="140" rx="14" ry="20" fill="#79876B"/>
</svg>
